name: Feature request
description: Propose a capability or an API change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you need to do and why the current API doesn't cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you have in mind, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
