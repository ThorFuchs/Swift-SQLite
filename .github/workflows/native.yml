name: Native CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS / build, test, iOS cross-compile, docs
    # Self-hosted runner on the maintainer's Mac (the GitHub-hosted `xcode-27` image is
    # not available). The maintainer registers the runner.
    # The repository is public: pull requests from forks never run on this runner, so
    # outside code can't execute on the maintainer's machine. Linux CI (GitHub-hosted)
    # still tests them; a maintainer can rerun macOS by pushing the branch here.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, macos-27]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      # Use Xcode's own toolchain even if the runner's environment selects another one.
      TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Removes untracked files, including a previous run's .build, before checkout.
          clean: true
          # Tags are needed for the API-breakage check.
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-path
          df -h "$GITHUB_WORKSPACE" | tail -1
      - name: Verify the vendored SQLite amalgamation
        run: Scripts/verify-amalgamation.sh
      - name: Build (debug and release)
        run: |
          xcrun swift build --build-tests
          xcrun swift build -c release --scratch-path .build/release
      - name: Test (macOS)
        run: mkdir -p .build/ci && xcrun swift test --xunit-output .build/ci/xunit.xml
      - name: Test with Thread Sanitizer
        run: xcrun swift test --sanitize=thread --scratch-path .build/tsan
      - name: API breakage check against the latest tag
        run: Scripts/check-api.sh
      - name: Cross-compile for iOS device (arm64-apple-ios18.0)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun swift build --build-tests --scratch-path .build/ios \
            --triple arm64-apple-ios18.0 --sdk "$SDK"
      - name: Cross-compile for iOS simulator (arm64-apple-ios18.0-simulator)
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swift build --build-tests --scratch-path .build/iossim \
            --triple arm64-apple-ios18.0-simulator --sdk "$SDK"
      - name: Documentation (warnings are errors)
        run: PATH="$(dirname "$(xcrun --find docc)"):$PATH" Scripts/build-docs.sh
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-results
          if-no-files-found: warn
          retention-days: 30
          path: .build/ci/
      # Disk space on the runner Mac is limited: all build output lives in the
      # workspace's .build and is deleted after the results are uploaded.
      - name: Remove build output
        if: always()
        run: rm -rf .build

  macos-hosted:
    # GitHub-hosted macOS with the Swift 6.4 toolchain from swift.org. It runs for every
    # pull request, including forks, so outside contributions get macOS coverage
    # without using the self-hosted runner.
    name: macOS (GitHub-hosted) / build and test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Swift 6.4 with swiftly
        run: |
          curl -fsSL -o swiftly.pkg https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . ~/.swiftly/env.sh
          swiftly install --use --assume-yes 6.4.2
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          rm swiftly.pkg
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build and test
        run: |
          swift build --build-tests
          swift test
