name: Linux CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    container:
      # Official Swift 6.4.0 Ubuntu 24.04 multi-architecture image (same digest as Swift-JSON).
      image: swift@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Verify the vendored SQLite amalgamation
        run: Scripts/verify-amalgamation.sh
      - name: Build (debug and release)
        run: |
          swift build --build-tests
          swift build -c release --scratch-path .build/release
      - name: Test (Linux, pinned SQLite amalgamation)
        run: mkdir -p .build/ci && swift test --xunit-output .build/ci/xunit.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.architecture }}-test-results
          if-no-files-found: warn
          retention-days: 30
          path: .build/ci/

  sanitizers:
    name: Linux / sanitizers (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: swift@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
      # ThreadSanitizer needs to disable ASLR (the runner kernel's randomization is
      # too high for its memory layout); the default seccomp profile forbids that.
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test with Thread Sanitizer
        # Known false positives (Swift Mutex on Linux, one benign SQLite race) are
        # listed with their reasons in .github/tsan-linux.supp.
        run: |
          export TSAN_OPTIONS="suppressions=$PWD/.github/tsan-linux.supp"
          setarch "$(uname -m)" -R swift test --sanitize=thread --scratch-path .build/tsan
      - name: Test with Address Sanitizer
        run: swift test --sanitize=address --scratch-path .build/asan
